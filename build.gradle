plugins {
    id 'java'
    id 'idea'
    id 'application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

// Standard Gradle source set configuration
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
    }
    test {
        java {
            // Use only the standard Gradle test location to avoid package conflicts
            srcDirs = ['src/test/java']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'lib', include: 'algs4.jar')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.hamcrest:hamcrest-core:1.3'
}

// Define tasks for specific packages
task runPuzzleSolver(type: JavaExec) {
    group = 'application'
    description = 'Runs the 8-Puzzle Solver'
    classpath = sourceSets.main.runtimeClasspath
    main = 'Solver'
    workingDir = file('src/main/java/08_puzzle')
}

task runBST(type: JavaExec) {
    group = 'application'
    description = 'Runs the Binary Search Tree'
    classpath = sourceSets.main.runtimeClasspath
    main = 'BinarySearchTree'
    workingDir = file('src/main/java/techlead_bst')
}

// Default application configuration
application {
    mainClass = 'PercolationStats'
}

// Compile task configurations
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:unchecked', '-Xlint:deprecation']
}

// Standard test task configuration
test {
    useJUnit()
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
        exceptionFormat = 'full'
    }
    
    // Always run tests even when they haven't changed
    outputs.upToDateWhen { false }
    
    // Show a summary of tests at the end
    afterSuite { desc, result ->
        if (desc.parent == null) {
            println "\nTest result: ${result.resultType}"
            println "Test summary: ${result.testCount} tests, " +
                    "${result.successfulTestCount} succeeded, " +
                    "${result.failedTestCount} failed, " +
                    "${result.skippedTestCount} skipped"
        }
    }
}

// Task for running just the BinarySearchTree tests
task testBST(type: Test) {
    group = 'verification'
    description = 'Runs the BinarySearchTree unit tests'
    useJUnit()
    testLogging {
        events "passed", "skipped", "failed"
    }
    include '**/techlead_bst/**'
}

// Task for running just the Graph algorithm tests
task testLeetCode(type: Test) {
    group = 'verification'
    description = 'Runs the LeetCode algorithm unit tests'
    useJUnit()
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
    include '**/leetcode/**'
}
