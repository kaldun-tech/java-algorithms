plugins {
    id 'java'
    id 'idea'
    id 'application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

// Standard Gradle source set configuration
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
    }
    test {
        java {
            // Use only the standard Gradle test location to avoid package conflicts
            srcDirs = ['src/test/java']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'lib', include: 'algs4.jar')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.hamcrest:hamcrest-core:1.3'
}

// Define tasks for specific packages
task runPuzzleSolver(type: JavaExec) {
    group = 'application'
    description = 'Runs the 8-Puzzle Solver'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'Solver' // Updated from 'main' to 'mainClass'
    workingDir = file('src/main/java/08_puzzle')
}

task runBST(type: JavaExec) {
    group = 'application'
    description = 'Runs the Binary Search Tree'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'BinarySearchTree' // Updated from 'main' to 'mainClass'
    workingDir = file('src/main/java/techlead_bst')
}

// KdTree visualizer tasks
task runKdTreeVisualizer(type: JavaExec) {
    group = 'application'
    description = 'Runs the KdTree Visualizer'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'KdTreeVisualizer'
    workingDir = file('src/main/java/11_kd-trees')
    // No arguments needed for KdTreeVisualizer as it accepts user clicks
}

task runNearestNeighborVisualizer(type: JavaExec) {
    group = 'application'
    description = 'Runs the Nearest Neighbor Visualizer'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'NearestNeighborVisualizer'
    workingDir = file('src/main/java/11_kd-trees')
    args '../../resources/data/2dpoints.txt'  // Pass the input file as an argument
}

task runRangeSearchVisualizer(type: JavaExec) {
    group = 'application'
    description = 'Runs the Range Search Visualizer'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'RangeSearchVisualizer'
    workingDir = file('src/main/java/11_kd-trees')
    args '../../resources/data/2dpoints.txt'  // Pass the input file as an argument
}

// Default application configuration
application {
    mainClass = 'PercolationStats'
}

// Compile task configurations
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:unchecked', '-Xlint:deprecation']
}

// Standard test task configuration
test {
    useJUnit()
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
        exceptionFormat = 'full'
    }
    
    // Always run tests even when they haven't changed
    outputs.upToDateWhen { false }
    
    // Show a summary of tests at the end
    afterSuite { desc, result ->
        if (desc.parent == null) {
            println "\nTest result: ${result.resultType}"
            println "Test summary: ${result.testCount} tests, " +
                    "${result.successfulTestCount} succeeded, " +
                    "${result.failedTestCount} failed, " +
                    "${result.skippedTestCount} skipped"
        }
    }
}

// Task for running just the BinarySearchTree tests
task testBST(type: Test) {
    group = 'verification'
    description = 'Runs the BinarySearchTree unit tests'
    useJUnit()
    testLogging {
        events "passed", "skipped", "failed"
    }
    include '**/techlead_bst/**'
}

// Task for running just the Graph algorithm tests
task testLeetCode(type: Test) {
    group = 'verification'
    description = 'Runs the LeetCode algorithm unit tests'
    useJUnit()
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
    include '**/leetcode/**'
}

// Task for running just the 8-puzzle tests
task testPuzzle(type: Test) {
    group = 'verification'
    description = 'Runs the 8-puzzle unit tests'
    useJUnit()
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
        showExceptions = true
        showCauses = true
        showStackTraces = true
    }
    
    // Use a more specific pattern to match the test files
    include 'BoardTest.class'
    include '**/*BoardTest.class'
    
    // Add the main classes to the test classpath
    classpath = sourceSets.main.runtimeClasspath + sourceSets.test.runtimeClasspath
    
    // Explicitly set the test classes directory to avoid the deprecation warning
    testClassesDirs = sourceSets.test.output.classesDirs
    
    // Set the working directory to include the 08_puzzle directory
    workingDir = file('src/test/java/08_puzzle')
}

// Task for running just the KdTree tests
task testKdTree(type: Test) {
    group = 'verification'
    description = 'Runs the KdTree and PointSET unit tests'
    useJUnit()
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
        showExceptions = true
        showCauses = true
        showStackTraces = true
    }
    
    // Use a pattern to match the KdTree test files
    include '**/*PointSETTest.class'
    include '**/*KdTreeTest.class'
    
    // Add the main classes to the test classpath
    classpath = sourceSets.main.runtimeClasspath + sourceSets.test.runtimeClasspath
    
    // Explicitly set the test classes directory to avoid the deprecation warning
    testClassesDirs = sourceSets.test.output.classesDirs
    
    // Set the working directory to include the 11_kd-trees directory
    workingDir = file('src/test/java/11_kd-trees')
}
